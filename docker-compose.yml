services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kompromap
      POSTGRES_PASSWORD: kompromap
      POSTGRES_DB: kompromap
    ports:
      - "5432:5432"
    volumes:
      - kompromap_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kompromap"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      POSTGRES_USER: kompromap
      POSTGRES_PASSWORD: kompromap
      POSTGRES_DB: kompromap
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      # Inside this container, "localhost" is the container itself — the
      # Vite dev-server proxy has to target the compose service name or
      # every /api/* call fails with ECONNREFUSED.
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  kompromap_pg_data:
