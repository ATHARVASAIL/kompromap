server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy API calls to the backend service, so the frontend's
    # relative fetch("/api/...") calls work same-origin without needing
    # VITE_API_BASE_URL set at all. Only relevant when frontend and backend
    # are deployed together (e.g. docker-compose.prod.yml) — if they're on
    # separate hosts, set VITE_API_BASE_URL at build time instead and this
    # block is simply unused.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
